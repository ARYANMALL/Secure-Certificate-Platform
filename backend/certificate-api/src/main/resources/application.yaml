spring:
  application:
    name: certificate-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/certificate_db}
    username: ${SPRING_DATASOURCE_USERNAME:certificate_user}
    password: ${SPRING_DATASOURCE_PASSWORD:certificate_password}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:http://localhost:8080}
    secret: ${JWT_SECRET}
    expiration-minutes: 15

app:

  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Platform Administrator}
      email: ${BOOTSTRAP_ADMIN_EMAIL}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}

  certificate-signing:
    keystore-path: ${CERTIFICATE_KEYSTORE_PATH:./keys/certificate-signing.p12}
    keystore-password: ${CERTIFICATE_KEYSTORE_PASSWORD}
    key-alias: certificate-signing
    signature-algorithm: SHA256withRSA

  verification:
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:3000/verify/}

  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}